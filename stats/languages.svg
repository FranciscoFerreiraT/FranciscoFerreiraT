<svg xmlns="http://www.w3.org/2000/svg" width="520" height="147" viewBox="0 0 520 147">
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #70a5fd; }
    .l { font: 400 14px 'Segoe UI', Ubuntu, sans-serif; fill: #c0caf5; }
    .v { font: 700 14px 'Segoe UI', Ubuntu, sans-serif; fill: #bf91f3; }
    .s { font: 400 12px 'Segoe UI', Ubuntu, sans-serif; fill: #8b92b8; }
    .big { font: 700 28px 'Segoe UI', Ubuntu, sans-serif; fill: #bf91f3; }
    .row { opacity: 0; animation: in .5s ease forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .bar { transform-origin: left; animation: grow .9s ease-out forwards; }
  </style>
  <rect x="0.5" y="0.5" rx="8" width="519" height="146" fill="#1a1b27" stroke="#2a2e3f"/>
  <text x="25" y="35" class="t">💻 Lenguajes más usados</text>
  <clipPath id="c"><rect x="25" y="55" width="470" height="10" rx="5"/></clipPath>
  <g clip-path="url(#c)" class="bar">
    <rect x="25.00" y="55" width="297.66" height="10" fill="#f1e05a"/>
    <rect x="322.66" y="55" width="124.55" height="10" fill="#663399"/>
    <rect x="447.22" y="55" width="47.78" height="10" fill="#e34c26"/>
  </g>
  <g class="row" style="animation-delay:0.40s"><circle cx="30" cy="90" r="5" fill="#f1e05a"/><text x="43" y="95" class="l">JavaScript</text><text x="240" y="95" class="s" text-anchor="end">63.3%</text></g>
  <g class="row" style="animation-delay:0.48s"><circle cx="275" cy="90" r="5" fill="#663399"/><text x="288" y="95" class="l">CSS</text><text x="485" y="95" class="s" text-anchor="end">26.5%</text></g>
  <g class="row" style="animation-delay:0.56s"><circle cx="30" cy="116" r="5" fill="#e34c26"/><text x="43" y="121" class="l">HTML</text><text x="240" y="121" class="s" text-anchor="end">10.2%</text></g>
</svg>
